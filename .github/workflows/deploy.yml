name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          # NEXT_PUBLIC_* vars are baked into the JS bundle at build time
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_FORMA_AI_WEBSITE_URL: "https://formaai.info"
          # Non-public vars needed for build-time type checking only
          FORMA_AI_WEBSITE_URL: "https://formaai.info"
          OPENROUTER_MODEL: "google/gemini-2.5-flash"
          # DATABASE_URL and OPENROUTER_API_KEY are runtime-only --
          # set them in Cloudflare Pages dashboard, not here.

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .open-next/assets --project-name=forma-ai-audit-tool
